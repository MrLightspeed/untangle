<svg class="path-comparison" xmlns="http://www.w3.org/2000/svg" width="1120" height="635" viewBox="0 0 1120 635" role="img" aria-labelledby="route-2-0-title route-2-0-description">
<title id="route-2-0-title">Look up a price: Price quotes detour through orders and storage</title>
<desc id="route-2-0-description">Every arrow is a supplied source-to-source handoff. The same owners keep their positions. Owners outside a route remain visible; crossings are layout, not extra connections.</desc>
<rect width="1120" height="635" rx="16" fill="#0a101b"/>
<text x="28.0" y="40.0" font-family="Arial, sans-serif" font-size="29" font-weight="400" fill="#f2f6fb" >Look up a price</text>
<text x="28.0" y="73.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#b9c9db" >Follow the arrows. Numbers identify each source-to-source handoff.</text>
<g transform="translate(0 0)">
<g class="route-phase" data-phase="before" transform="translate(16 0)">
<rect x="0" y="100" width="528" height="452" rx="12" fill="#101b2b" stroke="#35465d"/>
<text x="20.0" y="134.0" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#f2f6fb" >BEFORE / 3 handoffs</text>
<text x="20.0" y="164.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#f4a261" >Product ID</text>
<defs><marker id="route-2-0-before-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#f4a261"/></marker></defs>
<path d="M 129 302 C 129 360.0 399 360.0 399 418" fill="none" stroke="#101b2b" stroke-width="12"/>
<path class="route-wire" data-from="src/quotes.py" data-to="src/orders.py" d="M 129 302 C 129 360.0 399 360.0 399 418" fill="none" stroke="#f4a261" stroke-width="4" marker-end="url(#route-2-0-before-arrow)"/>
<circle cx="188.4" cy="327.52" r="13" fill="#f4a261" stroke="#101b2b" stroke-width="3"/>
<text x="188.4" y="332.5" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#10131b" text-anchor="middle">1</text>
<path d="M 290 474.0 L 238 474.0" fill="none" stroke="#101b2b" stroke-width="12"/>
<path class="route-wire" data-from="src/orders.py" data-to="src/storage.py" d="M 290 474.0 L 238 474.0" fill="none" stroke="#f4a261" stroke-width="4" marker-end="url(#route-2-0-before-arrow)"/>
<circle cx="278.56" cy="474.0" r="13" fill="#f4a261" stroke="#101b2b" stroke-width="3"/>
<text x="278.6" y="479.0" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#10131b" text-anchor="middle">2</text>
<path d="M 129 418 C 129 360.0 399 360.0 399 302" fill="none" stroke="#101b2b" stroke-width="12"/>
<path class="route-wire" data-from="src/storage.py" data-to="src/catalog.py" d="M 129 418 C 129 360.0 399 360.0 399 302" fill="none" stroke="#f4a261" stroke-width="4" marker-end="url(#route-2-0-before-arrow)"/>
<circle cx="188.4" cy="392.48" r="13" fill="#f4a261" stroke="#101b2b" stroke-width="3"/>
<text x="188.4" y="397.5" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#10131b" text-anchor="middle">3</text>
<g class="route-owner" data-file="src/quotes.py" data-active="true" transform="translate(20 190)">
<rect width="218" height="112" rx="9" fill="#0a101b" stroke="#7186a0" stroke-width="2"/>
<text x="14.0" y="31.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#dce6f2" >Quote</text>
<text x="14.0" y="95.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#b9c9db" >src/quotes.py:7</text>
</g>
<g class="route-owner" data-file="src/orders.py" data-active="true" transform="translate(290 418)">
<rect width="218" height="112" rx="9" fill="#0a101b" stroke="#7186a0" stroke-width="2"/>
<text x="14.0" y="31.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#dce6f2" >Order helper</text>
<text x="14.0" y="95.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#b9c9db" >src/orders.py:8</text>
</g>
<g class="route-owner" data-file="src/storage.py" data-active="true" transform="translate(20 418)">
<rect width="218" height="112" rx="9" fill="#0a101b" stroke="#7186a0" stroke-width="2"/>
<text x="14.0" y="31.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#dce6f2" >Storage helper</text>
<text x="14.0" y="95.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#b9c9db" >src/storage.py:18</text>
</g>
<g class="route-owner" data-file="src/catalog.py" data-active="true" transform="translate(290 190)">
<rect width="218" height="112" rx="9" fill="#0a101b" stroke="#7186a0" stroke-width="2"/>
<text x="14.0" y="31.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#dce6f2" >Catalog lookup</text>
<text x="14.0" y="95.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#b9c9db" >src/catalog.py:4</text>
</g>
</g>
<g class="route-phase" data-phase="after" transform="translate(576 0)">
<rect x="0" y="100" width="528" height="452" rx="12" fill="#101b2b" stroke="#35465d"/>
<text x="20.0" y="134.0" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#f2f6fb" >AFTER / 1 handoff</text>
<text x="20.0" y="164.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#f4a261" >Product ID</text>
<defs><marker id="route-2-0-after-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#f4a261"/></marker></defs>
<path d="M 238 246.0 L 290 246.0" fill="none" stroke="#101b2b" stroke-width="12"/>
<path class="route-wire" data-from="src/quotes.py" data-to="src/catalog.py" d="M 238 246.0 L 290 246.0" fill="none" stroke="#f4a261" stroke-width="4" marker-end="url(#route-2-0-after-arrow)"/>
<circle cx="249.44" cy="246.0" r="13" fill="#f4a261" stroke="#101b2b" stroke-width="3"/>
<text x="249.4" y="251.0" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#10131b" text-anchor="middle">1</text>
<g class="route-owner" data-file="src/quotes.py" data-active="true" transform="translate(20 190)">
<rect width="218" height="112" rx="9" fill="#0a101b" stroke="#7186a0" stroke-width="2"/>
<text x="14.0" y="31.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#dce6f2" >Quote</text>
<text x="14.0" y="95.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#b9c9db" >src/quotes.py:10</text>
</g>
<g class="route-owner" data-file="src/orders.py" data-active="false" transform="translate(290 418)">
<rect width="218" height="112" rx="9" fill="#0a101b" stroke="#435267" stroke-dasharray="5 5" stroke-width="2"/>
<text x="14.0" y="31.0" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#8495aa" >src/orders.py</text>
<text x="14.0" y="93.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#8495aa" >outside this route</text>
</g>
<g class="route-owner" data-file="src/storage.py" data-active="false" transform="translate(20 418)">
<rect width="218" height="112" rx="9" fill="#0a101b" stroke="#435267" stroke-dasharray="5 5" stroke-width="2"/>
<text x="14.0" y="31.0" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#8495aa" >src/storage.py</text>
<text x="14.0" y="93.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#8495aa" >outside this route</text>
</g>
<g class="route-owner" data-file="src/catalog.py" data-active="true" transform="translate(290 190)">
<rect width="218" height="112" rx="9" fill="#0a101b" stroke="#7186a0" stroke-width="2"/>
<text x="14.0" y="31.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#dce6f2" >Catalog lookup</text>
<text x="14.0" y="95.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#b9c9db" >src/catalog.py:4</text>
</g>
</g>
<text x="28.0" y="587.0" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#dce6f2" >3 handoffs before → 1 after. Wire color stays the same in both panels.</text>
<text x="28.0" y="617.0" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a9bed5" >Positions stay fixed across panels. Only the supplied handoffs are drawn.</text>
</g>
</svg>
