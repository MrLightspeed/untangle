<svg xmlns="http://www.w3.org/2000/svg" width="1034" height="508" viewBox="0 0 1034 508" role="img" aria-labelledby="title description">
<title id="title">Checkout wiring before and after</title>
<desc id="description">Quotes and pending orders each go from three source handoffs to one. File positions stay fixed. Storage now decodes JSON before sending order records to reconciliation.</desc>
<rect width="1034" height="508" rx="18" fill="#0b1220"/>
<text x="27.0" y="42.0" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#f2f6fb" >Two checkout detours become direct</text>
<defs>
<marker id="price-lookup" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.7" markerHeight="3.7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffb779"/></marker>
<marker id="read-pending-orders" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.7" markerHeight="3.7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#78e4d4"/></marker>
</defs>
<g data-phase="before" transform="translate(13 62)">
<rect width="500" height="407" rx="14" fill="#101c2d" stroke="#364a62"/>
<text x="20.0" y="37.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#f2f6fb" >Before</text>
<text x="20.0" y="70.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#ffb779" >Look up a price · Product ID · 3 handoffs</text>
<path d="M148 155 C377 144 387 239 290 276" fill="none" stroke="#101c2d" stroke-width="11"/>
<path data-route="price-lookup" data-from="quotes.py" data-to="orders.py" d="M148 155 C377 144 387 239 290 276" fill="none" stroke="#ffb779" stroke-width="4" marker-end="url(#price-lookup)"/>
<path d="M194 301 C166 301 159 324 130 348" fill="none" stroke="#101c2d" stroke-width="11"/>
<path data-route="price-lookup" data-from="orders.py" data-to="storage.py" d="M194 301 C166 301 159 324 130 348" fill="none" stroke="#ffb779" stroke-width="4" marker-end="url(#price-lookup)"/>
<path d="M148 374 C235 435 361 416 414 177" fill="none" stroke="#101c2d" stroke-width="11"/>
<path data-route="price-lookup" data-from="storage.py" data-to="catalog.py" d="M148 374 C235 435 361 416 414 177" fill="none" stroke="#ffb779" stroke-width="4" marker-end="url(#price-lookup)"/>
<text x="20.0" y="95.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#78e4d4" >Read pending orders · JSON bytes · 3 handoffs</text>
<path d="M68 348 C68 268 110 213 172 215" fill="none" stroke="#101c2d" stroke-width="11"/>
<path data-route="read-pending-orders" data-from="storage.py" data-to="history.py" d="M68 348 C68 268 110 213 172 215" fill="none" stroke="#78e4d4" stroke-width="4" marker-end="url(#read-pending-orders)"/>
<path d="M220 237 C220 258 222 267 222 276" fill="none" stroke="#101c2d" stroke-width="11"/>
<path data-route="read-pending-orders" data-from="history.py" data-to="orders.py" d="M220 237 C220 258 222 267 222 276" fill="none" stroke="#78e4d4" stroke-width="4" marker-end="url(#read-pending-orders)"/>
<path d="M326 301 C333 326 336 353 348 371" fill="none" stroke="#101c2d" stroke-width="11"/>
<path data-route="read-pending-orders" data-from="orders.py" data-to="reconcile.py" d="M326 301 C333 326 336 353 348 371" fill="none" stroke="#78e4d4" stroke-width="4" marker-end="url(#read-pending-orders)"/>
