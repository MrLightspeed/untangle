<rect x="348" y="348" width="132" height="44" rx="8" fill="#0b1220" stroke="#7389a3"/>
<text x="414.0" y="376.0" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#f2f6fb" text-anchor="middle">reconcile.py</text>
